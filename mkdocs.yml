site_name: Quantinue-Wiki
site_description: 팀 여름이었다 · SSOT — 확정 기준은 이 위키

docs_dir: wiki          # 심볼릭 링크로 STATUS/질문/facts를 실시간 반영

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR      # 본문 — 한글 가독성 좋은 무료 구글 폰트
    code: JetBrains Mono    # 코드 블록
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle: { icon: material/brightness-7, name: 다크 모드 }
    - scheme: slate
      primary: green
      accent: green
      toggle: { icon: material/brightness-4, name: 라이트 모드 }
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes    # 섹션 제목 클릭 시 개요(index) 페이지 표시
    - navigation.top
    - toc.follow
    - search.highlight
    - content.tables.wrap

extra_css:
  - assets/extra.css

nav:
  - 🏠 홈: index.md

  - 📘 프로젝트:
      - 🧭 한눈에 보기: facts/최종프로젝트.md
      - 🗓️ 실제 하루: 실제하루.md
      - 📈 검증 결과와 한계: 운영검증.md
      - 📦 최종 산출물: 산출물.md
      - 🎬 최종 발표·자료: 최종발표.md

  - ⚙️ 시스템:
      - 🧱 아키텍처 개요: 최종시스템.md
      - ⚙️ JOB·파이프라인: 파이프라인.md
      - 🧩 핵심 기능:
          - 핵심기능/index.md
          - 🧠 Strategist — 공격형·안전형: 핵심기능/strategist.md
          - ⚖️ Critic — 검증 4계층: 핵심기능/critic.md
          - 🛡️ WatchRunner — 1분 방어선: 핵심기능/watch.md
          - ⚡ 사건 재판단: 핵심기능/rejudge.md
          - 📓 Reviewer — T+1~T+5: 핵심기능/reviewer.md
          - ⚙️ 집행·수집·예산: 핵심기능/infra.md
      - 🗃️ 데이터 모델·ERD: 데이터모델.md
      - 📚 전체 데이터 사전: 데이터사전.md
      - 🎛️ 설정·정책 기준: 설정정책.md
      - 🛡️ AI 판단·안전장치: AI안전장치.md
      - 🔗 데이터·판단 계보: 데이터계보.md

  - 🛠️ 개발·운영:
      - 🛠️ 개발 시작하기: 개발시작하기.md
      - 🗺️ 코드맵: 코드맵.md
      - 🔌 API·화면 계약: API계약.md
      - 👥 역할·협업 계약: 역할협업계약.md
      - 📊 운영 현황: 현황판.md
      - 📘 운영 가이드: 운영가이드.md

  - 📜 기록:
      - ✅ 결정 로그: facts/결정로그.md
      - ❓ 논의 기록: 질문.md
      - 🤖 AI 추천 제안: 추천제안.md
      - 📜 업데이트 로그: 업데이트로그.md
      - 📅 프로젝트 일정: facts/일정.md
      - 🗣️ 회의록:
          - 회의록/index.md
          - 7차 (07-10): 회의록/2026-07-10.md
          - 6차-2 (07-09): 회의록/2026-07-09-2.md
          - 6차 (07-09): 회의록/2026-07-09.md
          - 5차 (07-08): 회의록/2026-07-08.md
          - 4차-2 (07-06): 회의록/2026-07-06-2.md
          - 4차 (07-06): 회의록/2026-07-06.md
          - 3차 (07-03): 회의록/2026-07-03.md
          - 1차 (06-30): 회의록/2026-06-30.md

  - 🧊 아카이브:
      - MVP 1차 (동결):
          - 🎯 MVP 1차 정의: facts/MVP1차.md
          - 🔄 파이프라인 (1차): facts/파이프라인.md
          - 🔌 데이터 계약 (1차): facts/데이터계약.md
          - 📖 용어 사전 (1차): facts/용어.md
          - 🖥️ 화면 (1차): facts/화면.md
      - 1차 역할 참고:
          - 에이전트/index.md
          - ⚙️ Core · Infra: 에이전트/core.md
          - 📰 Info Agent: 에이전트/info.md
          - 🧠 Strategist Agent: 에이전트/strategist.md
          - ⚖️ Critic Agent: 에이전트/critic.md
          - 📓 Reviewer Agent: 에이전트/reviewer.md
      - 위키 운영:
          - 📘 DocStill 사용 가이드: 가이드.md
          - 🛠️ DocStill 시스템 설명서: 시스템설명서.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
